<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-label="Logic">
  <defs>
    <linearGradient id="bg-logic-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f8f9fa"/>
      <stop offset="0.7" stop-color="#e9ecef"/>
      <stop offset="1"   stop-color="#dee2e6"/>
    </linearGradient>
    <radialGradient id="center-glow-logic-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c5a030" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c5a030" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="marco-logic-light">
      <rect width="600" height="150" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#marco-logic-light)">
    <!-- Fondo -->
    <rect width="600" height="150" fill="url(#bg-logic-light)"/>

    <!-- Resplandor central sutil -->
    <ellipse cx="300" cy="75" rx="200" ry="70" fill="url(#center-glow-logic-light)"/>

    <!-- Red de nodos y conexiones (Algoritmos/Patrones) -->
    <g stroke="#6b7280" stroke-width="0.8" opacity="0.3">
      <line x1="80" y1="40" x2="180" y2="80"/>
      <line x1="180" y1="80" x2="140" y2="120"/>
      <line x1="180" y1="80" x2="280" y2="50"/>
      <line x1="280" y1="50" x2="380" y2="90"/>
      <line x1="380" y1="90" x2="460" y2="40"/>
      <line x1="380" y1="90" x2="480" y2="120"/>
      <line x1="80" y1="40" x2="40" y2="100"/>
      <line x1="460" y1="40" x2="540" y2="70"/>
      <line x1="280" y1="50" x2="320" y2="130"/>
    </g>

    <!-- Nodos de la red -->
    <g>
      <!-- Nodos grises sutiles -->
      <circle cx="80"  cy="40"  r="3" fill="#6b7280" opacity="0.4"/>
      <circle cx="180" cy="80"  r="3" fill="#6b7280" opacity="0.4"/>
      <circle cx="140" cy="120" r="2.5" fill="#6b7280" opacity="0.35"/>
      <circle cx="380" cy="90"  r="3" fill="#6b7280" opacity="0.4"/>
      <circle cx="480" cy="120" r="2.5" fill="#6b7280" opacity="0.35"/>
      <circle cx="40"  cy="100" r="2" fill="#6b7280" opacity="0.3"/>
      <circle cx="540" cy="70"  r="2.5" fill="#6b7280" opacity="0.35"/>
      <circle cx="320" cy="130" r="2" fill="#6b7280" opacity="0.3"/>
      
      <!-- Nodos dorados (puntos clave de lógica) -->
      <circle cx="280" cy="50"  r="3.5" fill="#c5a030" opacity="0.75"/>
      <circle cx="460" cy="40"  r="3.5" fill="#c5a030" opacity="0.75"/>
    </g>

    <!-- Símbolos lógicos flotantes (como "estrellas" de conocimiento) -->
    <g font-family="'Fira Code', 'Courier New', monospace" fill="#6b7280" font-size="10">
      <text x="50"  y="30"  opacity="0.35">01</text>
      <text x="110" y="110" opacity="0.30">∧</text>
      <text x="220" y="135" opacity="0.35">∨</text>
      <text x="350" y="30"  opacity="0.30">⇒</text>
      <text x="420" y="115" opacity="0.35">∀</text>
      <text x="520" y="35"  opacity="0.30">∃</text>
      <text x="25"  y="80"  opacity="0.25">¬</text>
      <text x="560" y="100" opacity="0.25">≡</text>
    </g>

    <!-- Título -->
    <text x="300" y="65" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="26" font-weight="600" letter-spacing="10" fill="#111827">LOGIC</text>

    <!-- Líneas doradas a los lados del título -->
    <path d="M160 57 H190" stroke="#c5a030" stroke-width="1" opacity="0.7"/>
    <path d="M410 57 H440" stroke="#c5a030" stroke-width="1" opacity="0.7"/>

    <!-- Subtítulo -->
    <text x="300" y="88" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="9" font-weight="500" letter-spacing="6" fill="#4b5563">RETOS DE LÓGICA</text>

    <!-- Puntos dorados decorativos -->
    <circle cx="195" cy="85" r="1" fill="#c5a030" opacity="0.8"/>
    <circle cx="405" cy="85" r="1" fill="#c5a030" opacity="0.8"/>
  </g>

  <!-- Borde del banner -->
  <rect x="0.5" y="0.5" width="599" height="149" rx="12" fill="none" stroke="#d1d5db"/>
</svg>